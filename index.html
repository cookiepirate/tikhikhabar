<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>तीखी ख़बर Studio Pro - Split Video & Live Ticker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Devanagari', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-3 md:p-6 flex flex-col items-center">

    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Studio Controls -->
        <div class="lg:col-span-7 bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <div>
                    <h1 class="text-2xl font-black text-red-500 tracking-tight">तीखी ख़बर STUDIO PRO</h1>
                    <p class="text-xs text-zinc-400">tikhikhabar.com • Split-Screen & Live Animated Ticker</p>
                </div>
                <span class="bg-red-600/20 text-red-400 border border-red-600/40 text-xs font-bold px-3 py-1 rounded-full animate-pulse">● LIVE ENGINE</span>
            </div>

            <!-- Format & Split Mode -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">1. Aspect Ratio</label>
                    <select id="format" onchange="updateCanvasSize()" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:border-red-500 outline-none">
                        <option value="9:16">9:16 Vertical (Reels / Shorts)</option>
                        <option value="16:9">16:9 Landscape (YouTube / Broadcast)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">2. Video Layout Mode</label>
                    <select id="layoutMode" onchange="toggleSecondVideoUI()" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:border-red-500 outline-none">
                        <option value="split">Half & Half Split (2 Videos)</option>
                        <option value="single">Single Full Video (1 Video)</option>
                    </select>
                </div>
            </div>

            <!-- Video Uploaders (1 & 2) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-zinc-950/60 p-3 rounded-xl border border-zinc-800">
                <div>
                    <label class="block text-xs font-bold text-red-400 mb-1">Video 1 (Top / Main Audio) *</label>
                    <input type="file" id="videoFile1" accept="video/*" class="w-full text-xs text-zinc-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-red-600 file:text-white hover:file:bg-red-700 cursor-pointer bg-zinc-800 rounded-lg border border-zinc-700">
                </div>
                <div id="video2Container">
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-bold text-amber-400">Video 2 (Bottom / B-Roll)</label>
                        <label class="flex items-center space-x-1 text-[11px] text-zinc-400 cursor-pointer">
                            <input type="checkbox" id="muteVid2" checked class="accent-red-600">
                            <span>Mute Vid 2</span>
                        </label>
                    </div>
                    <input type="file" id="videoFile2" accept="video/*" class="w-full text-xs text-zinc-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer bg-zinc-800 rounded-lg border border-zinc-700">
                </div>
            </div>

            <!-- Main Headline -->
            <div>
                <label class="block text-xs font-bold text-zinc-300 mb-1">Top Red Banner Headline (मुख्य ख़बर)</label>
                <textarea id="headline" rows="2" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:border-red-500 outline-none">सिकंदराबाद में प्रशासन की बड़ी कार्रवाई, मुख्य मार्ग पर यातायात व्यवस्था में बदलाव</textarea>
            </div>

            <!-- Moving News Ticker + Live WordPress Fetcher -->
            <div class="bg-zinc-950/60 p-3 rounded-xl border border-zinc-800 space-y-2">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <label class="text-xs font-bold text-amber-400 flex items-center gap-1">
                        <span>⚡ Bottom Moving News Ticker (स्क्रॉलिंग पट्टी)</span>
                    </label>
                    <button onclick="fetchTikhiKhabarNews()" id="fetchBtn" type="button" class="bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-500/40 text-[11px] font-bold px-2.5 py-1 rounded-lg transition">
                        🔄 Fetch Latest from tikhikhabar.com
                    </button>
                </div>
                <input type="text" id="tickerText" value="तीखी ख़बर पर दिनभर की बड़ी ख़बरें: सिकंदराबाद और बुलंदशहर क्षेत्र की हर ताज़ा अपडेट के लिए जुड़े रहें tikhikhabar.com के साथ • प्रशासन ने जारी की नई गाइडलाइंस • अपराध और भ्रष्टाचार के खिलाफ तीखी ख़बर की विशेष मुहिम" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm text-white focus:border-red-500 outline-none">
                <div class="flex items-center justify-between text-[11px] text-zinc-400 pt-1">
                    <span>Ticker Speed:</span>
                    <input type="range" id="tickerSpeed" min="1" max="8" value="3" class="w-40 accent-red-600">
                </div>
            </div>

            <!-- Location & Brand Name -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">Location Pill (स्थान / जिला)</label>
                    <input type="text" id="locationTag" value="सिकंदराबाद" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm text-white focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">Brand Badge Text</label>
                    <input type="text" id="channelTag" value="तीखी ख़बर" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm text-white focus:border-red-500 outline-none">
                </div>
            </div>

            <!-- Byte / Middle Tag & Reporter Strip -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">Center Divider / Byte Tag</label>
                    <input type="text" id="byteTitle" value="बाइट - संबंधित अधिकारी" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm text-white focus:border-red-500 outline-none" placeholder="खाली छोड़ने पर छुप जाएगा">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">Reporter Name / Contact Strip</label>
                    <input type="text" id="reporterInfo" value="तीखी ख़बर ब्यूरो | tikhikhabar.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm text-white focus:border-red-500 outline-none">
                </div>
            </div>

            <!-- Optional Custom Logo & Reporter Photo Uploads -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-zinc-800">
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Custom Logo PNG (Optional)</label>
                    <input type="file" id="logoFile" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:bg-zinc-700 file:text-white cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Reporter Photo (Optional)</label>
                    <input type="file" id="avatarFile" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:bg-zinc-700 file:text-white cursor-pointer">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button onclick="togglePreviewPlay()" id="previewBtn" class="sm:w-1/3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded-xl border border-zinc-700 text-sm transition">
                    ▶ Play Videos
                </button>
                <button onclick="startExport()" id="exportBtn" class="sm:w-2/3 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-red-900/40 transition">
                    🔴 Record & Export Final Video
                </button>
            </div>

            <div id="status" class="hidden p-3 bg-zinc-800/90 border border-zinc-700 rounded-xl text-center text-xs"></div>
        </div>

        <!-- Right Column: Live Animated Broadcast Preview -->
        <div class="lg:col-span-5 flex flex-col items-center justify-center bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-2xl">
            <div class="flex items-center justify-between w-full mb-2 px-2">
                <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Live Animated Preview</span>
                <span class="text-[11px] text-emerald-400 font-semibold">● Ticker Active</span>
            </div>
            <div class="w-full flex items-center justify-center overflow-hidden">
                <canvas id="previewCanvas" width="720" height="1280" class="max-h-[600px] w-auto rounded-xl border border-zinc-700 shadow-xl bg-black"></canvas>
            </div>
        </div>

    </div>

    <!-- Hidden source video elements -->
    <video id="sourceVideo1" class="hidden" playsinline crossorigin="anonymous"></video>
    <video id="sourceVideo2" class="hidden" playsinline crossorigin="anonymous" loop></video>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const video1 = document.getElementById('sourceVideo1');
        const video2 = document.getElementById('sourceVideo2');

        let logoImg = null;
        let avatarImg = null;
        let isExporting = false;

        // Animation state variables
        let tickerOffset = 720;
        let breakingBgOffset = 0;
        let pulsePhase = 0;

        // Load Video 1
        document.getElementById('videoFile1').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            video1.src = URL.createObjectURL(file);
            video1.load();
            video1.onloadeddata = () => { video1.currentTime = 0.1; };
        });

        // Load Video 2
        document.getElementById('videoFile2').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            video2.src = URL.createObjectURL(file);
            video2.load();
            video2.onloadeddata = () => { video2.currentTime = 0.1; };
        });

        // Load Optional Logo
        document.getElementById('logoFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => { logoImg = img; };
            img.src = URL.createObjectURL(file);
        });

        // Load Optional Reporter Photo
        document.getElementById('avatarFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => { avatarImg = img; };
            img.src = URL.createObjectURL(file);
        });

        function toggleSecondVideoUI() {
            const isSplit = document.getElementById('layoutMode').value === 'split';
            const container = document.getElementById('video2Container');
            container.style.opacity = isSplit ? '1' : '0.4';
            container.style.pointerEvents = isSplit ? 'auto' : 'none';
        }

        function updateCanvasSize() {
            const isShorts = document.getElementById('format').value === '9:16';
            canvas.width = isShorts ? 720 : 1280;
            canvas.height = isShorts ? 1280 : 720;
            tickerOffset = canvas.width;
        }

        // Fetch Live Posts from tikhikhabar.com WordPress REST API
        async function fetchTikhiKhabarNews() {
            const btn = document.getElementById('fetchBtn');
            const tickerInput = document.getElementById('tickerText');
            const originalText = btn.innerText;
            btn.innerText = "⏳ Fetching tikhikhabar.com...";
            btn.disabled = true;

            try {
                const res = await fetch('https://tikhikhabar.com/wp-json/wp/v2/posts?per_page=6&_fields=title');
                if (!res.ok) throw new Error('API Error');
                const posts = await res.json();
                if (posts && posts.length > 0) {
                    const tempDiv = document.createElement('div');
                    const headlines = posts.map(p => {
                        tempDiv.innerHTML = p.title.rendered;
                        return tempDiv.textContent || tempDiv.innerText || "";
                    }).filter(Boolean);

                    tickerInput.value = "तीखी ख़बर ताज़ा अपडेट: " + headlines.join("  •  ") + "  •  लगातार खबरों के लिए विजिट करें www.tikhikhabar.com";
                    tickerOffset = canvas.width;
                    btn.innerText = "✅ Latest News Loaded!";
                } else {
                    throw new Error('No posts');
                }
            } catch (err) {
                // Fallback via AllOrigins proxy in case of browser CORS restriction
                try {
                    const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://tikhikhabar.com/wp-json/wp/v2/posts?per_page=6&_fields=title');
                    const res2 = await fetch(proxyUrl);
                    const data = await res2.json();
                    const posts = JSON.parse(data.contents);
                    const tempDiv = document.createElement('div');
                    const headlines = posts.map(p => {
                        tempDiv.innerHTML = p.title.rendered;
                        return tempDiv.textContent || tempDiv.innerText || "";
                    }).filter(Boolean);
                    tickerInput.value = "तीखी ख़बर ताज़ा अपडेट: " + headlines.join("  •  ") + "  •  विजिट करें www.tikhikhabar.com";
                    tickerOffset = canvas.width;
                    btn.innerText = "✅ Latest News Loaded!";
                } catch (e2) {
                    alert("सीधे खबरें लोड नहीं हो सकीं (CORS/Network). आप नीचे बॉक्स में खुद भी खबरें लिख या पेस्ट कर सकते हैं।");
                    btn.innerText = originalText;
                }
            } finally {
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }, 2500);
            }
        }

        function togglePreviewPlay() {
            if (!video1.src) {
                alert("कृपया पहले Video 1 चुनें (Please select Video 1 first).");
                return;
            }
            const btn = document.getElementById('previewBtn');
            const isSplit = document.getElementById('layoutMode').value === 'split';

            if (video1.paused) {
                video1.muted = false;
                video1.play();
                if (isSplit && video2.src) {
                    video2.muted = document.getElementById('muteVid2').checked;
                    video2.play();
                }
                btn.innerText = "⏸ Pause Videos";
            } else {
                video1.pause();
                if (video2.src) video2.pause();
                btn.innerText = "▶ Play Videos";
            }
        }

        function drawRoundedRect(ctx, x, y, width, height, radius, fill, stroke, lineWidth = 3) {
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(x, y, width, height, radius);
            } else {
                ctx.rect(x, y, width, height);
            }
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
        }

        // Helper to center-crop video into any target slot
        function drawVideoSlot(vid, x, y, slotW, slotH, placeholderLabel) {
            if (vid && vid.readyState >= 2) {
                const vw = vid.videoWidth || slotW;
                const vh = vid.videoHeight || slotH;
                const scale = Math.max(slotW / vw, slotH / vh);
                const sw = slotW / scale;
                const sh = slotH / scale;
                const sx = (vw - sw) / 2;
                const sy = (vh - sh) / 2;
                ctx.drawImage(vid, sx, sy, sw, sh, x, y, slotW, slotH);
            } else {
                ctx.fillStyle = "#141418";
                ctx.fillRect(x, y, slotW, slotH);
                ctx.fillStyle = "#52525b";
                ctx.font = "bold 22px 'Noto Sans Devanagari', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(placeholderLabel, x + slotW / 2, y + slotH / 2);
            }
        }

        function drawPreviewFrame() {
            const w = canvas.width;
            const h = canvas.height;
            const isShorts = (w === 720);
            const isSplit = document.getElementById('layoutMode').value === 'split';

            const headline = document.getElementById('headline').value;
            const locationTag = document.getElementById('locationTag').value;
            const channelTag = document.getElementById('channelTag').value;
            const byteTitle = document.getElementById('byteTitle').value;
            const reporterInfo = document.getElementById('reporterInfo').value;
            const tickerText = document.getElementById('tickerText').value;
            const speed = parseFloat(document.getElementById('tickerSpeed').value) || 3;

            pulsePhase += 0.08;
            breakingBgOffset -= 1.8;
            if (breakingBgOffset < -600) breakingBgOffset = 0;

            // 1. Studio Background Gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, '#091536');
            bgGrad.addColorStop(0.5, '#050811');
            bgGrad.addColorStop(1, '#1a0505');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            if (isShorts) {
                // ==========================================
                // 9:16 VERTICAL REELS / SHORTS LAYOUT
                // ==========================================
                const vidY = 255;
                const vidH = 815; // y: 255 to 1070

                if (isSplit) {
                    const halfH = vidH / 2;
                    // Top Half: Video 1
                    drawVideoSlot(video1, 0, vidY, w, halfH, "Video 1 (ऊपर का वीडियो यहाँ दिखेगा)");
                    // Bottom Half: Video 2 (or Video 1 mirrored if Video 2 not uploaded yet)
                    drawVideoSlot(video2.src ? video2 : null, 0, vidY + halfH, w, halfH, "Video 2 (नीचे का दूसरा वीडियो यहाँ दिखेगा)");

                    // White & Red Divider Line between Top and Bottom Video
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, vidY + halfH - 2, w, 4);
                } else {
                    drawVideoSlot(video1, 0, vidY, w, vidH, "आपका वीडियो यहाँ दिखेगा (Video Area)");
                }

                // Top Red Rounded Breaking News Header Box
                const boxX = 16, boxY = 42, boxW = w - 32, boxH = 180;
                const redGrad = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
                redGrad.addColorStop(0, '#dc2626');
                redGrad.addColorStop(1, '#7f1d1d');
                drawRoundedRect(ctx, boxX, boxY, boxW, boxH, 22, redGrad, '#ffffff', 3.5);

                // Animated Flashing "BREAKING NEWS" Top Pill
                const pulseAlpha = 0.65 + 0.35 * Math.sin(pulsePhase);
                drawRoundedRect(ctx, w / 2 - 110, boxY - 16, 220, 32, 16, '#090d16', '#facc15', 2);
                ctx.beginPath();
                ctx.arc(w / 2 - 84, boxY, 6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(239, 68, 68, ${pulseAlpha})`;
                ctx.fill();
                ctx.fillStyle = "#facc15";
                ctx.font = "900 15px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("BREAKING NEWS", w / 2 + 10, boxY + 5);

                // Headline Text inside Red Banner
                ctx.fillStyle = "#ffffff";
                ctx.font = "800 34px 'Noto Sans Devanagari', sans-serif";
                ctx.textAlign = "center";
                wrapText(ctx, headline, w / 2, boxY + 62, boxW - 36, 44);

                // Location Pill (Bottom-Left overlapping Red Banner)
                if (locationTag.trim() !== "") {
                    ctx.font = "800 25px 'Noto Sans Devanagari', sans-serif";
                    const locW = Math.max(ctx.measureText(locationTag).width + 44, 145);
                    drawRoundedRect(ctx, 30, boxY + boxH - 22, locW, 46, 12, '#b91c1c', '#ffffff', 3);
                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";
                    ctx.fillText(locationTag, 30 + locW / 2, boxY + boxH + 9);
                }

                // TikhiKhabar Logo Badge (Bottom-Right overlapping Red Banner)
                const badgeW = 215, badgeH = 48;
                const badgeX = w - badgeW - 26;
                const badgeY = boxY + boxH - 22;
                drawRoundedRect(ctx, badgeX, badgeY, badgeW, badgeH, 24, '#090d16', '#ffffff', 3);

                if (logoImg) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(badgeX + 26, badgeY + 24, 18, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(logoImg, badgeX + 8, badgeY + 6, 36, 36);
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(badgeX + 26, badgeY + 24, 18, 0, Math.PI * 2);
                    ctx.fillStyle = "#ef4444";
                    ctx.fill();
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "900 14px 'Noto Sans Devanagari', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("तीखी", badgeX + 26, badgeY + 29);
                }

                ctx.fillStyle = "#ffffff";
                ctx.font = "800 22px 'Noto Sans Devanagari', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(channelTag, badgeX + 125, badgeY + 32);

                // Center Byte Pill (Sits right on the split line or middle-left)
                if (byteTitle.trim() !== "") {
                    ctx.font = "700 23px 'Noto Sans Devanagari', sans-serif";
                    const byteW = Math.min(ctx.measureText(byteTitle).width + 44, w - 50);
                    const byteY = isSplit ? (vidY + vidH / 2 - 23) : 640;
                    drawRoundedRect(ctx, 22, byteY, byteW, 44, 22, 'rgba(220, 38, 38, 0.95)', '#ffffff', 2.5);
                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "left";
                    ctx.fillText(byteTitle, 42, byteY + 30, byteW - 36);
                }

                // Reporter Strip + Circular Avatar (Just above the Footer)
                const repY = 1005;
                if (reporterInfo.trim() !== "") {
                    ctx.font = "700 23px 'Noto Sans Devanagari', sans-serif";
                    const repW = Math.min(ctx.measureText(reporterInfo).width + 65, w - 115);
                    drawRoundedRect(ctx, 92, repY, repW, 44, 12, '#b91c1c', '#ffffff', 2.5);
                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "left";
                    ctx.fillText(reporterInfo, 122, repY + 30, repW - 35);
                }

                const avX = 62, avY = repY + 18, avR = 44;
                ctx.save();
                ctx.beginPath();
                ctx.arc(avX, avY, avR, 0, Math.PI * 2);
                ctx.fillStyle = "#18181b";
                ctx.fill();
                ctx.clip();
                if (avatarImg) {
                    ctx.drawImage(avatarImg, avX - avR, avY - avR, avR * 2, avR * 2);
                } else if (logoImg) {
                    ctx.drawImage(logoImg, avX - avR, avY - avR, avR * 2, avR * 2);
                } else {
                    ctx.fillStyle = "#991b1b";
                    ctx.fillRect(avX - avR, avY - avR, avR * 2, avR * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "900 20px 'Noto Sans Devanagari', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("तीखी", avX, avY - 2);
                    ctx.fillText("ख़बर", avX, avY + 20);
                }
                ctx.restore();
                ctx.beginPath();
                ctx.arc(avX, avY, avR, 0, Math.PI * 2);
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Animated Breaking News Footer + Bottom Moving Ticker
                const footY = 1070;
                const footGrad = ctx.createLinearGradient(0, footY, w, footY);
                footGrad.addColorStop(0, '#091536');
                footGrad.addColorStop(0.5, '#1e3a8a');
                footGrad.addColorStop(1, '#091536');
                ctx.fillStyle = footGrad;
                ctx.fillRect(0, footY, w, 130);

                ctx.fillStyle = "#dc2626";
                ctx.fillRect(0, footY, w, 5);

                // Animated Scrolling Giant "BREAKING NEWS" Background Watermark
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, footY, w, 130);
                ctx.clip();
                ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
                ctx.font = "900 64px sans-serif";
                ctx.textAlign = "left";
                const bgRepeat = "BREAKING NEWS • तीखी ख़बर • BREAKING NEWS • तीखी ख़बर • ";
                ctx.fillText(bgRepeat, breakingBgOffset, footY + 82);
                ctx.restore();

                // Foreground Website Badge in Footer
                ctx.fillStyle = "#ffffff";
                ctx.font = "900 32px 'Noto Sans Devanagari', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("BREAKING NEWS • तीखी ख़बर", w / 2, footY + 58);

                ctx.fillStyle = "#facc15";
                ctx.font = "700 20px sans-serif";
                ctx.fillText("🌐 www.tikhikhabar.com", w / 2, footY + 95);

                // BOTTOM MOVING NEWS TICKER BAR (y: 1200 to 1280)
                drawMovingTickerBar(0, 1200, w, 80, tickerText, speed);

            } else {
                // ==========================================
                // 16:9 LANDSCAPE BROADCAST LAYOUT
                // ==========================================
                const vidH = h - 140;
                if (isSplit) {
                    const halfW = w / 2;
                    drawVideoSlot(video1, 0, 0, halfW, vidH, "Video 1 (Left)");
                    drawVideoSlot(video2.src ? video2 : null, halfW, 0, halfW, vidH, "Video 2 (Right)");
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(halfW - 2, 0, 4, vidH);
                } else {
                    drawVideoSlot(video1, 0, 0, w, vidH, "आपका 16:9 वीडियो यहाँ दिखेगा");
                }

                // Top-Right TikhiKhabar Logo
                drawRoundedRect(ctx, w - 250, 26, 215, 54, 12, 'rgba(185, 28, 28, 0.95)', '#ffffff', 2.5);
                ctx.fillStyle = "#ffffff";
                ctx.font = "800 26px 'Noto Sans Devanagari', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(channelTag, w - 142, 62);

                // Top-Left Location Pill
                if (locationTag.trim() !== "") {
                    drawRoundedRect(ctx, 36, 26, 190, 48, 10, 'rgba(9, 13, 22, 0.9)', '#dc2626', 2.5);
                    ctx.fillStyle = "#facc15";
                    ctx.font = "700 22px 'Noto Sans Devanagari', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("📍 " + locationTag, 131, 58);
                }

                // Lower-Third Breaking Headline Bar
                const ltY = h - 140;
                const redGrad = ctx.createLinearGradient(0, ltY, w, ltY);
                redGrad.addColorStop(0, '#991b1b');
                redGrad.addColorStop(0.5, '#dc2626');
                redGrad.addColorStop(1, '#991b1b');
                ctx.fillStyle = redGrad;
                ctx.fillRect(0, ltY, w, 75);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, ltY, w, 4);

                ctx.fillStyle = "#ffffff";
                ctx.font = "800 29px 'Noto Sans Devanagari', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(headline, w / 2, ltY + 48, w - 80);

                // Bottom Moving Ticker Bar (y: h - 65 to h)
                drawMovingTickerBar(0, h - 65, w, 65, tickerText, speed);
            }
        }

        function drawMovingTickerBar(x, y, barW, barH, text, speed) {
            // Dark Red/Black Ticker Background
            ctx.fillStyle = "#090d16";
            ctx.fillRect(x, y, barW, barH);
            ctx.fillStyle = "#facc15";
            ctx.fillRect(x, y, barW, 3);

            // Scrolling Text Area
            ctx.save();
            const labelW = 195;
            ctx.beginPath();
            ctx.rect(x + labelW, y, barW - labelW, barH);
            ctx.clip();

            ctx.font = "700 26px 'Noto Sans Devanagari', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "left";

            const fullTicker = text + "   •   " + text + "   •   ";
            const textWidth = ctx.measureText(fullTicker).width;

            tickerOffset -= speed;
            if (tickerOffset < -textWidth / 2) {
                tickerOffset = 0;
            }

            ctx.fillText(fullTicker, x + labelW + tickerOffset, y + barH / 2 + 9);
            ctx.restore();

            // Left Fixed "ताज़ा ख़बर" Badge
            const badgeGrad = ctx.createLinearGradient(x, y, x + labelW, y);
            badgeGrad.addColorStop(0, '#dc2626');
            badgeGrad.addColorStop(1, '#991b1b');
            ctx.fillStyle = badgeGrad;
            ctx.fillRect(x, y + 3, labelW, barH - 3);

            ctx.fillStyle = "#facc15";
            ctx.fillRect(x + labelW - 4, y + 3, 4, barH - 3);

            // Flashing dot + label
            const dotAlpha = 0.5 + 0.5 * Math.sin(pulsePhase * 1.5);
            ctx.beginPath();
            ctx.arc(x + 24, y + barH / 2 + 1, 7, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(250, 204, 21, ${dotAlpha})`;
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "900 23px 'Noto Sans Devanagari', sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("ताज़ा ख़बर", x + 42, y + barH / 2 + 9);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lineCount = 0;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line.trim(), x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                    lineCount++;
                    if (lineCount >= 2) break;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line.trim(), x, y);
        }

        async function startExport() {
            if (!video1.src) {
                alert("कृपया पहले कम से कम Video 1 फ़ाइल चुनें! (Please select Video 1 first)");
                return;
            }

            const exportBtn = document.getElementById('exportBtn');
            const statusDiv = document.getElementById('status');
            const isSplit = document.getElementById('layoutMode').value === 'split';

            isExporting = true;
            exportBtn.disabled = true;
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = '<span class="text-yellow-400 font-bold animate-pulse">🔴 Recording Split Video & Animated Ticker... Keep this tab open until Video 1 finishes playing.</span>';

            video1.pause();
            video1.currentTime = 0;
            video1.muted = false;

            if (isSplit && video2.src) {
                video2.pause();
                video2.currentTime = 0;
                video2.muted = document.getElementById('muteVid2').checked;
            }

            const canvasStream = canvas.captureStream(30);

            try {
                const vidStream = video1.captureStream ? video1.captureStream() : (video1.mozCaptureStream ? video1.mozCaptureStream() : null);
                if (vidStream && vidStream.getAudioTracks().length > 0) {
                    canvasStream.addTrack(vidStream.getAudioTracks()[0]);
                }
            } catch (e) {
                console.warn("Audio track merge skipped:", e);
            }

            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm';
            }

            const recorder = new MediaRecorder(canvasStream, { mimeType, videoBitsPerSecond: 5000000 });
            const chunks = [];

            recorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
                isExporting = false;
                exportBtn.disabled = false;
                if (video2.src) video2.pause();

                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);

                statusDiv.innerHTML = `
                    <p class="text-green-400 font-bold mb-2">✅ तीखी ख़बर Split & Animated Video Ready!</p>
                    <a href="${url}" download="TikhiKhabar-Reel-${Date.now()}.webm" class="inline-block bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded-lg text-xs shadow-lg">
                        ⬇ Download Final Branded Video
                    </a>
                `;
            };

            await video1.play();
            if (isSplit && video2.src) {
                await video2.play();
            }
            recorder.start();

            video1.onended = () => {
                if (isExporting && recorder.state === "recording") {
                    recorder.stop();
                }
            };
        }

        // Continuous 30fps loop so the ticker & breaking news animations always run smoothly
        function masterLoop() {
            drawPreviewFrame();
            requestAnimationFrame(masterLoop);
        }

        window.onload = () => {
            masterLoop();
        };
    </script>
