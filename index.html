<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>तीखी ख़बर Studio - News Reel Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Devanagari', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-3 md:p-6 flex flex-col items-center">

    <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Controls -->
        <div class="lg:col-span-7 bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <div>
                    <h1 class="text-2xl font-black text-red-500 tracking-tight">तीखी ख़बर STUDIO</h1>
                    <p class="text-xs text-zinc-400">tikhikhabar.com • Broadcast Reel & Video Maker</p>
                </div>
                <span class="bg-red-600/20 text-red-400 border border-red-600/40 text-xs font-bold px-3 py-1 rounded-full">9:16 & 16:9</span>
            </div>

            <!-- Format & Video Upload -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">Video Format</label>
                    <select id="format" onchange="updateCanvasSize()" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:border-red-500 outline-none">
                        <option value="9:16">9:16 Vertical (Reels / Shorts)</option>
                        <option value="16:9">16:9 Landscape (YouTube / Web)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">1. Select Source Video *</label>
                    <input type="file" id="videoFile" accept="video/*" class="w-full text-xs text-zinc-300 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-red-600 file:text-white hover:file:bg-red-700 cursor-pointer bg-zinc-800 rounded-lg border border-zinc-700">
                </div>
            </div>

            <!-- Main Headline -->
            <div>
                <label class="block text-xs font-bold text-zinc-300 mb-1">Top Red Banner Headline (मुख्य ख़बर)</label>
                <textarea id="headline" rows="2" oninput="drawPreviewFrame()" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:border-red-500 outline-none">सिकंदराबाद में प्रशासन की बड़ी कार्रवाई, मुख्य मार्ग पर यातायात व्यवस्था में बदलाव</textarea>
            </div>

            <!-- Location & Brand Name -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1">Location Pill (स्थान / जिला)</label>
                    <input type="text" id="locationTag"
