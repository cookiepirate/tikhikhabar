<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>तीखी ख़बर Studio - Mobile Web Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-2xl">
        <div class="flex items-center justify-center mb-2">
            <span class="bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">LIVE STUDIO</span>
        </div>
        <h1 class="text-2xl font-extrabold text-red-600 text-center mb-1">तीखी ख़बर Studio</h1>
        <p class="text-xs text-zinc-400 text-center mb-6">Upload your video, add breaking news banners, and brand it instantly for YouTube & Shorts.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Format</label>
                <select id="format" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-600">
                    <option value="16:9">16:9 Landscape (YouTube / TV Broadcast)</option>
                    <option value="9:16">9:16 Vertical (Shorts / Reels)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Breaking News Headline</label>
                <input type="text" id="headline" value="उत्तराखंड: एक्सप्रेसवे निर्माण कार्य तेज, यातायात में बदलाव" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Flash News / Ticker Content</label>
                <input type="text" id="ticker" value="बड़ी ख़बर: स्थानीय प्रशासन ने भारी वाहनों के लिए डायवर्जन रूट किया जारी।" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Upload Source Video</label>
                <input type="file" id="videoFile" accept="video/*" class="w-full text-xs text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-700 cursor-pointer">
            </div>

            <button onclick="processVideo()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-red-900/30 flex items-center justify-center space-x-2">
                <span>Export Branded Video</span>
            </button>
        </div>
    </div>

    <script>
        function processVideo() {
            const fileInput = document.getElementById('videoFile');
            const headline = document.getElementById('headline').value;
            const format = document.getElementById('format').value;

            if (fileInput.files.length === 0) {
                alert("कृपया पहले कोई वीडियो फ़ाइल अपलोड करें! (Please upload a video file first)");
                return;
            }

            alert("Video processing engine initialized for " + format + " format with headline: \"" + headline + "\". Ready for export!");
        }
    </script>
</body>
</html>
